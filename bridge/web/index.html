<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project UAI · Cowork</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="gate" hidden><form id="gate-form" class="gate-card">
    <img src="icon.svg" width="48" height="48" alt=""><h1>Project UAI</h1>
    <p>Connect to your Roblox workspace.</p><label>Bridge token<input id="gate-token" type="password" autocomplete="off" required placeholder="Paste from the bridge console"></label>
    <button class="primary">Connect</button><p id="gate-error" role="alert"></p>
  </form></main>
  <div id="app" hidden>
    <aside id="sidebar">
      <div class="sidebar-top"><button id="newThread" title="New conversation" aria-label="New conversation">＋</button><button id="searchThreads" title="Search conversations" aria-label="Search conversations" aria-controls="threadSearch" aria-expanded="false">⌕</button><span>Project UAI</span><button id="closeSidebar" aria-label="Close sidebar">×</button></div>
      <div class="segments"><button data-page="cowork">▣ Cowork</button><button data-page="chat" class="selected">✳ Chat</button></div>
      <button id="newConversation" class="outline">＋ <span>New conversation</span></button>
      <button data-page="settings" class="nav-row">☷ Customize</button>
      <details class="more-nav" open><summary>More</summary><nav>
        <button data-page="agents">Subagents</button><button data-page="providers">Providers</button><button data-page="tools">Tools</button><button data-page="loops">Chat loops</button><button data-page="memory">Memory &amp; skills</button><button data-page="logs">Logs &amp; traces</button><button data-page="settings">Settings</button>
      </nav></details>
      <input id="threadSearch" placeholder="Search conversations…" aria-label="Search conversations" hidden>
      <div id="threads" class="history"></div>
      <a id="discordLink" class="nav-row" href="https://discord.gg/9xYyyYuKap" target="_blank" rel="noopener">Join our Discord</a>
      <button id="profile" data-page="settings"><img src="icon.svg" width="24" height="24" alt=""><span><strong id="playerName">you</strong><small id="providerName">No provider connected</small></span><span>⌃</span></button>
    </aside>
    <div class="workspace">
      <header><button id="sidebarToggle" aria-label="Toggle sidebar" aria-controls="sidebar" aria-expanded="true">☰</button><strong id="pageTitle">Chat</strong><span id="status" class="muted" role="status">Connecting…</span><span class="spacer"></span><button id="runtimeBadge" data-page="cowork">Game runtime</button><button id="exportChat" title="Export conversation">Export</button><button id="clear" title="Clear conversation">Clear</button></header>
      <section id="chatPage">
        <div id="taskStrip" hidden></div><div id="loopStrip" hidden></div>
        <main id="transcript" aria-live="polite"></main><button id="latest" hidden>↓ Jump to latest</button>
        <div id="questions"></div>
        <footer class="composer-wrap"><div id="attachments"></div><div class="composer">
          <button id="attach" aria-label="Attach text or code files">＋</button><input id="fileInput" type="file" accept="text/*,.lua,.luau,.json,.md,.js,.ts,.tsx,.jsx,.py,.csv,.yaml,.yml,.toml,.html,.css,.log" multiple hidden>
          <textarea id="input" rows="1" placeholder="Message UAI…" aria-label="Message"></textarea>
          <button id="modelButton"><span class="dot"></span><span id="modelLabel">Select model</span><span>⌄</span></button>
          <button id="options" aria-label="Composer options">···</button><button id="send" class="primary" aria-label="Send message">↑</button><button id="stop" class="danger" hidden aria-label="Stop turn">■</button>
        </div><small id="composerHint">Enter to send · Shift+Enter for a new line</small></footer>
      </section>
      <main id="panel" hidden></main>
    </div>
  </div>
  <dialog id="modal" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose" aria-label="Close dialog">×</button></div><div id="modalBody"></div></dialog>
  <div id="toast" role="status" hidden></div>
  <script src="markdown.js"></script><script src="app.js"></script>
</body>
</html>
